[package]
name = "tnid"
version = "0.0.6"
edition = "2024"
description = "A UUID compatible ID with static type checking"
license = "MIT"
documentation = "https://docs.rs/tnid"
repository = "https://github.com/mkeedlinger/tnid-rust"
readme = "README.md"

[dependencies]
aes = { version = "0.8.4", optional = true }
fpe = { version = "0.6.1", optional = true }
rand = { version = "0.8.5", optional = true }
time = { version = "0.3.36", optional = true }
uuid = { version = "1", optional = true }
serde = { version = "1", optional = true }
sqlx = { version = "0.8.3", default-features = false, optional = true }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
proptest = "1.9.0"
serde_json = "1"
bincode = "1"


[features]
default = ["time", "rand"]
encryption = ["dep:aes", "dep:fpe"]
time = ["dep:time"]
rand = ["dep:rand"]
uuid = ["dep:uuid"]
serde = ["dep:serde"]
sqlx-postgres = ["dep:sqlx", "sqlx/postgres"]
sqlx-mysql = ["dep:sqlx", "sqlx/mysql"]
sqlx-sqlite = ["dep:sqlx", "sqlx/sqlite"]

# docs.rs-specific configuration
# https://docs.rs/about/metadata
[package.metadata.docs.rs]
# Build docs with all features so gated items (like encryption) appear
all-features = true
# Enable the `docsrs` cfg so `doc_auto_cfg` activates (see lib.rs)
rustdoc-args = ["--cfg", "docsrs"]
